<title>الحضور والانصراف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--d:#0b3b3a;--p:#0f766e;--o:#c2410c;--bg:#eef2f5;--tx:#14213d;--mu:#64748b;--bd:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom,0)}
header{background:linear-gradient(135deg,#0b3b3a,#0f766e);color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 14px 38px;display:flex;align-items:center;gap:10px}
.lg{width:84px;height:56px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--d);font-weight:700;font-size:15px;text-align:center;line-height:1.2;padding:4px;box-shadow:0 2px 8px #0003;flex:none}
.lg.dk{background:#263343;padding:0}
.lg img{max-width:100%;max-height:100%;object-fit:contain}
.tt{flex:1;text-align:center}.tt h1{margin:0;font-size:19px}.tt div{font-size:12.5px;opacity:.85;margin-top:2px}
main{max-width:480px;margin:-24px auto 0;padding:0 12px 28px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0f172a14}
.lab{font-size:13px;font-weight:700;color:var(--mu);margin-bottom:8px}
.site{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;min-height:30px}
#sl{height:40px;max-width:96px;object-fit:contain;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:3px}
.site span{flex:1}.site.ok span{color:#15803d}
a{color:var(--p);font-size:13px;cursor:pointer;font-weight:600}
select,input{width:100%;font:inherit;font-size:16px;padding:12px;margin:4px 0;border:1.5px solid var(--bd);border-radius:12px;background:#f8fafc;color:var(--tx)}
select:focus,input:focus{outline:0;border-color:var(--p)}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#0f172a;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam.rear video{transform:none}
.cam i{position:absolute;inset:10% 27%;border:3px dashed #ffffffaa;border-radius:50%}
.row{display:flex;gap:10px;margin-top:12px}
button{flex:1;border:0;color:#fff;font:inherit;font-weight:700;font-size:18px;padding:15px 8px;border-radius:14px;background:var(--p);cursor:pointer;box-shadow:0 3px 8px #0f766e44}
button.o{background:var(--o);box-shadow:0 3px 8px #c2410c44}
button.g{background:#fff;color:var(--d);border:1.5px solid var(--bd);box-shadow:none;font-size:15px}
button:disabled{opacity:.45}
.msg{margin-top:12px;padding:11px;border-radius:12px;text-align:center;font-weight:700;display:none}
.msg.ok{display:block;background:#dcfce7;color:#166534}.msg.err{display:block;background:#fee2e2;color:#991b1b}.msg.wait{display:block;background:#e0f2fe;color:#075985}
.v{display:flex;gap:8px;align-items:center;background:#f1f5f9;border-radius:12px;padding:10px;margin:7px 0;font-size:14px}
.v span{flex:1}.v button{flex:none;font-size:14px;padding:8px 14px;box-shadow:none}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:14px}
</style>
</head>

var q = new URLSearchParams(location.search), site = q.get('site') || '', S = [], pin = '';
function $(i){return document.getElementById(i)}
function msg(id, t, k){var e = $(id); e.textContent = t; e.className = 'msg' + (t ? ' ' + (k || 'err') : '')}
function post(d){return fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(d)}).then(function(r){return r.json()})}
function tick(){var n = new Date(); $('clk').textContent = n.toLocaleDateString('ar-EG', {weekday: 'long', day: 'numeric', month: 'long'}) + ' • ' + n.toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'})}
tick(); setInterval(tick, 20000);
function setSite(s, note){
  site = s; $('sn').textContent = s ? s + (note || '') : 'اختار الموقع'; $('sc').className = 'site' + (s ? ' ok' : '');
  var lo = ''; for (var k in LOGOS) if (s && s.indexOf(k) == 0) lo = LOGOS[k];
  $('sl').hidden = !lo; if (lo) $('sl').src = lo;
  $('vs').textContent = s; $('chg').hidden = !$('sg').options.length; fill(false);
}
function fill(all){
  var n = $('nm'), l = S.filter(function(s){return all || (site && String(s.s).trim() == site)});
  n.innerHTML = '<option value="">اختار اسمك…</option>';
  l.forEach(function(s){var o = document.createElement('option'); o.value = s.n; o.dataset.c = s.c; o.textContent = s.n + (s.c ? ' – ' + s.c : '') + (all ? ' – ' + s.s : ''); n.appendChild(o)});
  if (!l.length && site) msg('m', 'مفيش أسماء مسجلة للموقع ده، اضغط "اعرض كل الأسماء"');
}
function auto(){
  navigator.geolocation.getCurrentPosition(function(p){
    post({action: 'nearest', lat: p.coords.latitude, lng: p.coords.longitude}).then(function(r){
      if (r.ok && r.within) {$('sg').value = r.site; setSite(r.site, ' ✓')}
      else {setSite('', ''); $('sn').textContent = r.ok ? 'مش جوه نطاق أي موقع (أقرب: ' + r.site + ' – ' + r.dist + ' متر)' : 'اختار الموقع'; $('sg').hidden = false}
    }).catch(function(){setSite('', ''); $('sg').hidden = false});
  }, function(){setSite('', ''); $('sn').textContent = 'اختار الموقع'; $('sg').hidden = false}, {enableHighAccuracy: true, timeout: 12000});
}
fetch(API).then(function(r){return r.json()}).then(function(d){
  S = d.staff;
  var g = $('sg'); g.innerHTML = '<option value="">اختار الموقع…</option>';
  d.sites.forEach(function(x){var o = document.createElement('option'); o.textContent = x; g.appendChild(o)});
  g.onchange = function(){setSite(g.value, ''); g.hidden = !!g.value};
  $('chg').onclick = function(){g.hidden = false; $('chg').hidden = true};
  if (site) {g.value = site; setSite(site, ''); g.hidden = true} else auto();
}).catch(function(){msg('m', 'مشكلة في الاتصال، حاول تاني')});
$('all').onclick = function(){fill(true)};
var stream = null, facing = 'user';
function startCam(mode){
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return msg('m', 'افتح الرابط من متصفح حديث (https) عشان الكاميرا تشتغل');
  if (stream) stream.getTracks().forEach(function(t){t.stop()});
  navigator.mediaDevices.getUserMedia({video: {facingMode: mode}, audio: false}).then(function(st){
    stream = st; facing = mode; $('v').srcObject = st; $('v2').srcObject = st;
    document.querySelectorAll('.cam').forEach(function(c){c.classList.toggle('rear', mode != 'user')});
  }).catch(function(){msg('m', 'لازم تسمح باستخدام الكاميرا')});
}
startCam('user');
function bt(on){document.querySelectorAll('#att button').forEach(function(b){b.disabled = !on})}
function done(t, k){msg('m', t, k); bt(true)}
function go(type){
  var o = $('nm').selectedOptions[0], v = $('v');
  if (!site) return msg('m', 'اختار الموقع الأول');
  if (!o || !o.value) return msg('m', 'اختار اسمك الأول');
  if (!v.videoWidth) return msg('m', 'الكاميرا مش شغالة');
  msg('m', 'بيتم التسجيل…', 'wait'); bt(false);
  var c = document.createElement('canvas'); c.width = 480; c.height = Math.round(480 * v.videoHeight / v.videoWidth);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  var d = {name: o.value, code: o.dataset.c || '', site: site, type: type, photo: c.toDataURL('image/jpeg', .7)};
  navigator.geolocation.getCurrentPosition(function(p){
    d.lat = p.coords.latitude; d.lng = p.coords.longitude;
    post(d).then(function(r){done(r.ok ? 'تم تسجيل ' + type + ' الساعة ' + r.time + ' ✅' : r.msg, r.ok ? 'ok' : 'err')})
      .catch(function(){done('مشكلة في الاتصال، حاول تاني')});
  }, function(){done('لازم تسمح باللوكيشن')}, {enableHighAccuracy: true, timeout: 15000});
}

  }).catch(function(){msg('sm', 'مشكلة في الاتصال')});
};

    .then(function(r){
      if (r.ok) {msg('sm', 'تم تسجيل الدخول ✅', 'ok'); $('vn').value = $('ve').value = $('vp').value = ''; vlist()} else msg('sm', r.msg)
    }).catch(function(){msg('sm', 'مشكلة في الاتصال')});
};
function vlist(){

    var l = $('vl'); l.innerHTML = '';

      var d = document.createElement('div'); d.className = 'v';
      var t = document.createElement('span'); t.textContent = v.n + ' (' + v.t + ')' + (v.e ? ' – ' + v.e : '') + (v.w ? ' – ' + v.w : '') + ' • دخل ' + (v.d ? v.d + ' ' : '') + v.i + (v.o ? ' • خرج ' + v.o : ''); d.appendChild(t);

      l.appendChild(d);

  });
}

  if (!v.videoWidth) return msg('sm', 'الكاميرا مش شغالة');
  msg('sm', 'بيتم التسجيل…', 'wait');
  var c = document.createElement('canvas'); c.width = 480; c.height = Math.round(480 * v.videoHeight / v.videoWidth);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  post({name: n, site: site, type: type, photo: c.toDataURL('image/jpeg', .7), pin: pin}).then(function(r){
    msg('sm', r.ok ? 'تم تسجيل ' + type + ' ' + n + ' الساعة ' + r.time + ' ✅' : r.msg, r.ok ? 'ok' : 'err');
  }).catch(function(){msg('sm', 'مشكلة في الاتصال، حاول تاني')});
}
$('ein').onclick = function(){esend('حضور')};
$('eout').onclick = function(){esend('انصراف')};
// ===== تثبيت التطبيق على الشاشة الرئيسية =====
var dp = null;
function isApp(){return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone}
function dismissed(){try{return localStorage.getItem('insx') == '1'}catch(e){return false}}
function showIns(t, btn){$('it').textContent = t; $('ib').hidden = !btn; $('ins').hidden = false}
window.addEventListener('beforeinstallprompt', function(e){e.preventDefault(); dp = e; if (!isApp() && !dismissed()) showIns('اضغط "تثبيت" وهتلاقي أيقونة الحضور على شاشة موبايلك.', true)});
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !isApp() && !dismissed()) showIns('افتح الرابط من Safari، واضغط زر المشاركة ⬆️ واختار "إضافة إلى الشاشة الرئيسية".', false);
$('ib').onclick = function(){if (dp) {dp.prompt(); dp = null} $('ins').hidden = true};
$('ix').onclick = function(){$('ins').hidden = true; try{localStorage.setItem('insx', '1')}catch(e){}};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
